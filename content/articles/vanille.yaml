title: vanille
category: Filière Agricole
date: 2026-07-24
summary: >-
  L'OCPR fixe les orientations techniques et le calendrier officiel pour la
  collecte et la préparation des gousses de vanille.


  Dans le cadre de sa mission d'encadrement et d'appui-conseil aux producteurs,
  l'OCPR a réuni les coopératives et les préparateurs agréés pour sensibiliser
  aux normes de séchage et de calibrage. L'objectif est de garantir une qualité
  d'excellence sur les marchés d'exportation européens et américains.
image: /uploads/images/articles/vanille/image.png
content: >-

  Coopération & Formation • 02 Novembre 2024

  Renforcement du partenariat institutionnel avec les coopératives d'Ylang-Ylang

  Atelier de formation sur l'amélioration de l'efficacité énergétique des
  alambics à Anjouan et Mohéli.


  Afin d'assurer une distillation plus écologique et économique de
  l'Ylang-Ylang, l'OCPR a déployé une série d'ateliers techniques à destination
  des distillateurs locaux, permettant d'optimiser la consommation de bois et
  d'élever la pureté des huiles essentielles obtenues.
